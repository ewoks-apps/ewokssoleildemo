include:
  - project: dau/ci/pyci
    file: .gitlab-ci-template.yml

variables:
  DISABLE_BLACK_FLAKE8: "yes"
test-3.10:
  extends: .test-3.10

test-3.14:
  extends: .test-3.14

build_sdist:
  extends: .build_sdist

test_sdist-3.10:
  extends: .test_sdist-3.10

test_sdist-3.14:
  extends: .test_sdist-3.14

ruff:
  extends: .ruff

build_doc:
  extends: .build_doc

pages:
  extends: .pages

assets:
  extends: .assets

pypi:
  extends: .pypi

testpypi:
  extends: .testpypi

.workflow:
  extends: .test-3.12-redis
  script:
    - python -m pip install $PIP_INSTALL_OPTIONS .[job]
    - python -m pip list
    - redis-server --save "" --appendonly no --daemonize yes
    - ./scripts/start_worker.sh redis --logfile=worker_redis.log &
    - ./scripts/start_worker.sh sqlite --logfile=worker_sqlite.log &
    - python doc/_ext/make_pymca_config.py pymca_example.cfg
    - python scripts/make_flyscan_data.py pymca_example.cfg scan_0001.nxs parameters.json
    - python -m ewokssoleildemo.apps.xrfmap scan_0001.nxs parameters.json processed_local $WORKFLOW_OPTIONS
    - EWOKS_CONFIG_URI=scripts/config_redis.py python -m ewokssoleildemo.apps.xrfmap scan_0001.nxs parameters.json processed_redis --submit --wait $WORKFLOW_OPTIONS
    - EWOKS_CONFIG_URI=scripts/config_sqlite.py python -m ewokssoleildemo.apps.xrfmap scan_0001.nxs parameters.json processed_sqlite --submit --wait $WORKFLOW_OPTIONS
  artifacts:
    paths:
      - worker_*.log
    when: always
    expire_in: 2h

scenario_a1:
  extends: .workflow

scenario_a2:
  extends: .workflow
  variables:
    WORKFLOW_OPTIONS: "--select-area"
