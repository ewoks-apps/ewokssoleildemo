name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  # Build Python package
  build:
    uses: ewoks-apps/.github/.github/workflows/python-build.yml@main

  # Run tests
  tests:
    needs: build
    uses: ewoks-apps/.github/.github/workflows/python-tests.yml@main
    with:
      python-version: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]

  # Run linter / checks
  checks:
    uses: ewoks-apps/.github/.github/workflows/python-check.yml@main

  # Build documentation
  docs:
    needs: build
    uses: ewoks-apps/.github/.github/workflows/python-docs.yml@main

  # Execute the workflows with the example data: locally, and on Redis and SQLite workers
  workflows:
    name: ${{ matrix.workflow }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - workflow: xrfmap_flyscan
            parameters: ""
          - workflow: xrfmap_flyscan_select_area
            parameters: "-pn select:signal=Ta_L"
    env:
      WORKFLOW: ${{ matrix.workflow }}
      PARAMETERS: ${{ matrix.parameters }}
    services:
      redis:
        image: redis
        ports:
          - 6379:6379

    steps:
      - uses: ewoks-apps/.github/.github/actions/setup-python-package@main
        with:
          install-extras: "job"

      - name: Execute the workflow
        run: |
          ewoksjob --config scripts/config_redis.py worker --pool=process --logfile=worker_redis.log &
          ewoksjob --config scripts/config_sqlite.py worker --pool=process --logfile=worker_sqlite.log &
          python doc/_ext/make_pymca_config.py pymca_example.cfg
          python scripts/make_flyscan_data.py pymca_example.cfg scan_0001.nxs
          # Arguments: ewoks command, output directory, other options
          xrfmap() {
            command=$1
            processed=$PWD/$2
            shift 2
            $command $WORKFLOW --workflow-module ewokssoleildemo.workflows \
              -pn convert:filename=$PWD/scan_0001.nxs \
              -pn convert:output_filename=$processed/scan_0001_bliss.h5 \
              -pn 'sum:detector_names=["xmap1_det00","xmap1_det01"]' \
              -pn 'sum:detector_normalization_template=0.1*<instrument/{}/trigger_count_rate>/(<instrument/{}/elapsed_time>*<instrument/{}/event_count_rate>)' \
              -pn sum:output_root_uri=$processed/scan_0001_xrf.h5::/1.1 \
              -pn fit:config=$PWD/pymca_example.cfg \
              -pn fit:energy_name=energy \
              -pn norm:counter_name=i0 \
              -pn 'regrid:positioners=["samx","samz"]' \
              $PARAMETERS --outputs end --merge-outputs "$@"
          }
          xrfmap "ewoks execute" processed_local
          (export EWOKS_CONFIG_URI=scripts/config_redis.py; xrfmap "ewoksjob submit" processed_redis --load-remote --wait 300)
          (export EWOKS_CONFIG_URI=scripts/config_sqlite.py; xrfmap "ewoksjob submit" processed_sqlite --load-remote --wait 300)

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: worker-logs-${{ matrix.workflow }}
          path: worker_*.log
          retention-days: 1

  # Single stable check for branch protection: aggregates all other jobs so
  # branch protection never needs updating when jobs/matrix entries change.
  ci-gate:
    name: CI gate
    needs: [build, tests, checks, docs, workflows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs succeeded
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "A required job failed or was cancelled"
            exit 1
          fi
